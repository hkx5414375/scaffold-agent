name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(git ls-files '*.go' | xargs gofmt -l)"
          test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...
      - name: Build
        run: go build ./cmd/scaffold-agent
      - name: Doctor
        run: go run ./cmd/scaffold-agent doctor --json

  generated-admin:
    name: Generated Vue administration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: internal/generator/golang/templates/admin/package-lock.json
      - name: Audit locked dependencies
        working-directory: internal/generator/golang/templates/admin
        run: npm audit --package-lock-only --audit-level=high
      - name: Generate, lint, test, and build administration UI
        env:
          SCAFFOLD_AGENT_RUN_ADMIN_BUILD: "1"
        run: go test ./internal/engine -run TestGoPlanApplyVerifyEndToEnd -count=1
