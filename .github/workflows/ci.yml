name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(git ls-files '*.go' | xargs gofmt -l)"
          test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...
      - name: Build
        run: go build ./cmd/scaffold-agent
      - name: Doctor
        run: go run ./cmd/scaffold-agent doctor --json

  generated-admin:
    name: Shared generated Vue administration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: internal/generator/admin/templates/package-lock.json
      - name: Audit locked dependencies
        working-directory: internal/generator/admin/templates
        run: npm audit --package-lock-only --audit-level=high
      - name: Generate, lint, test, and build administration UI
        env:
          SCAFFOLD_AGENT_RUN_ADMIN_BUILD: "1"
        run: go test ./internal/engine -run '^(TestGoPlanApplyVerifyEndToEnd|TestGoTenantLifecyclePostgreSQLPlanApplyVerifyEndToEnd|TestGoTenantFilesPostgreSQLPlanApplyVerifyEndToEnd|TestGoFilesWithoutTenancyPostgreSQLPlanApplyVerifyEndToEnd|TestGoTenantJobAdministrationPostgreSQLPlanApplyVerifyEndToEnd|TestGoJobAdministrationWithoutTenancyPostgreSQLPlanApplyVerifyEndToEnd|TestGoTenantCSVImportExportPostgreSQLPlanApplyVerifyEndToEnd|TestGoTenantApprovalWorkflowsPostgreSQLPlanApplyVerifyEndToEnd|TestGoTenantCommerceCatalogPostgreSQLPlanApplyVerifyEndToEnd|TestJavaPostgreSQLTenancyLifecyclePlanApplyVerifyEndToEnd|TestJavaPostgreSQLPlatformCapabilitiesCompose|TestJavaPostgreSQLTenantApprovalWorkflowsPlanApplyVerifyEndToEnd|TestJavaPostgreSQLTenantCommerceCatalogPlanApplyVerifyEndToEnd|TestJavaPostgreSQLTenantCustomerAccountsPlanApplyVerifyEndToEnd|TestPythonPostgreSQLAdminPlanApplyVerifyEndToEnd|TestPythonPostgreSQLTenantFilesPlanApplyVerifyEndToEnd|TestPythonPostgreSQLTenantJobAdministrationPlanApplyVerifyEndToEnd|TestPythonPostgreSQLTenantCSVImportExportPlanApplyVerifyEndToEnd|TestPythonPostgreSQLTenantApprovalWorkflowsPlanApplyVerifyEndToEnd|TestPythonPostgreSQLTenantCommerceCatalogPlanApplyVerifyEndToEnd|TestPythonPostgreSQLPlatformCapabilitiesCompose)$' -count=1

  generated-storefront:
    name: Shared generated Nuxt storefront foundation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: internal/generator/storefront/templates/package-lock.json
      - name: Audit locked dependencies
        working-directory: internal/generator/storefront/templates
        run: npm audit --package-lock-only --audit-level=high
      - name: Generate all backend variants and run storefront quality gates
        env:
          SCAFFOLD_AGENT_RUN_STOREFRONT_BUILD: "1"
        run: go test ./internal/engine -run '^(TestSharedNuxtStorefrontPlanApplyVerifyAllBackends|TestGoCommerceCatalogStorefrontPlanApplyVerifyBothDatabases|TestGoCustomerAccountsStorefrontPlanApplyVerifyBothDatabases|TestJavaCommerceCatalogStorefrontPlanApplyVerifyBothDatabases|TestJavaCustomerAccountsStorefrontPlanApplyVerifyBothDatabases|TestPythonCommerceCatalogStorefrontPlanApplyVerifyBothDatabases)$' -count=1

  generated-java:
    name: Generated Java identity and CRUD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Generate and verify PostgreSQL and MySQL Maven projects
        env:
          SCAFFOLD_AGENT_RUN_JAVA_BUILD: "1"
        run: go test ./internal/engine -run '^TestJava(PostgreSQL|MySQL)(Identity|CRUD|Tenancy|TenancyMembers|TenancyLifecycle|TenantJobs|TenantNotifications|TenantFiles|TenantCache|TenantJobAdministration|TenantCSVImportExport|TenantApprovalWorkflows|TenantCommerceCatalog|TenantCustomerAccounts|CustomerAccounts|Observability)PlanApplyVerifyEndToEnd$|^TestJavaPostgreSQL(Jobs|Notifications|Files|Cache|JobAdministration|CSVImportExport|ApprovalWorkflows|CommerceCatalog)PlanApplyVerifyEndToEnd$|^TestJavaPostgreSQLPlatformCapabilitiesCompose$' -count=1

  generated-python:
    name: Generated Python platform and commerce catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9
        with:
          version: "0.12.8"
          enable-cache: true
      - name: Generate and verify PostgreSQL and MySQL Python projects
        env:
          SCAFFOLD_AGENT_RUN_PYTHON_BUILD: "1"
        run: go test ./internal/engine -run '^TestPython(PostgreSQL|MySQL)(Identity|CRUD|Tenancy|TenantCRUD|TenancyMembers|TenancyLifecycle|Jobs|TenantJobs|Notifications|TenantNotifications|Files|TenantFiles|Cache|TenantCache|JobAdministration|TenantJobAdministration|Observability|TenantObservability|TenantCSVImportExport|TenantApprovalWorkflows|CommerceCatalog|TenantCommerceCatalog)PlanApplyVerifyEndToEnd$|^TestPython(PostgreSQL|MySQL)PlatformCapabilitiesCompose$|^TestPythonPostgreSQLTenantFilesCachePlanApplyVerifyEndToEnd$' -count=1

  generated-postgresql:
    name: Generated PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: scaffold_agent
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres-python:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: scaffold_agent_python
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9
        with:
          version: "0.12.8"
          enable-cache: true
      - name: Generate and test against PostgreSQL
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/scaffold_agent?sslmode=disable
        run: go test ./internal/engine -run '^(TestGoTenantNotificationsPostgreSQLPlanApplyVerifyEndToEnd|TestGoTenantFilesPostgreSQLPlanApplyVerifyEndToEnd|TestGoTenantCachePostgreSQLPlanApplyVerifyEndToEnd|TestGoTenantJobAdministrationPostgreSQLPlanApplyVerifyEndToEnd|TestGoTenantObservabilityPostgreSQLPlanApplyVerifyEndToEnd|TestGoTenantCSVImportExportPostgreSQLPlanApplyVerifyEndToEnd|TestGoTenantApprovalWorkflowsPostgreSQLPlanApplyVerifyEndToEnd|TestGoTenantCommerceCatalogPostgreSQLPlanApplyVerifyEndToEnd|TestGoTenantCustomerAccountsPostgreSQLPlanApplyVerifyEndToEnd)$' -count=1
      - name: Generate Java and test tenant platform capabilities against PostgreSQL
        env:
          SCAFFOLD_AGENT_RUN_JAVA_BUILD: "1"
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/scaffold_agent
          TEST_DATABASE_USER: postgres
          TEST_DATABASE_PASSWORD: postgres
        run: go test ./internal/engine -run '^TestJavaPostgreSQLTenant(Notifications|Files|Cache|JobAdministration|CSVImportExport|ApprovalWorkflows|CommerceCatalog|CustomerAccounts)PlanApplyVerifyEndToEnd$|^TestJavaPostgreSQLObservabilityPlanApplyVerifyEndToEnd$' -count=1
      - name: Generate Python and test platform capabilities against PostgreSQL
        env:
          SCAFFOLD_AGENT_RUN_PYTHON_BUILD: "1"
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5433/scaffold_agent_python
        run: go test ./internal/engine -run '^TestPythonPostgreSQLTenant(Notifications|Files|Cache|JobAdministration|Observability|CSVImportExport|ApprovalWorkflows|CommerceCatalog)PlanApplyVerifyEndToEnd$' -count=1

  generated-mysql:
    name: Generated MySQL integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_DATABASE: scaffold_agent_python
          MYSQL_ROOT_PASSWORD: mysql
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pmysql"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9
        with:
          version: "0.12.8"
          enable-cache: true
      - name: Generate and test against MySQL
        env:
          TEST_DATABASE_URL: "root:mysql@tcp(127.0.0.1:3306)/"
        run: go test ./internal/engine -run '^(TestGoTenantNotificationsMySQLPlanApplyVerifyEndToEnd|TestGoTenantFilesMySQLPlanApplyVerifyEndToEnd|TestGoTenantCacheMySQLPlanApplyVerifyEndToEnd|TestGoTenantJobAdministrationMySQLPlanApplyVerifyEndToEnd|TestGoTenantObservabilityMySQLPlanApplyVerifyEndToEnd|TestGoTenantCSVImportExportMySQLPlanApplyVerifyEndToEnd|TestGoTenantApprovalWorkflowsMySQLPlanApplyVerifyEndToEnd|TestGoTenantCommerceCatalogMySQLPlanApplyVerifyEndToEnd|TestGoTenantCustomerAccountsMySQLPlanApplyVerifyEndToEnd)$' -count=1
      - name: Generate Java and test tenant platform capabilities against MySQL
        env:
          SCAFFOLD_AGENT_RUN_JAVA_BUILD: "1"
          TEST_DATABASE_URL: "jdbc:mysql://127.0.0.1:3306/?useSSL=false&allowPublicKeyRetrieval=true"
          TEST_DATABASE_USER: root
          TEST_DATABASE_PASSWORD: mysql
        run: go test ./internal/engine -run '^TestJavaMySQLTenant(Notifications|Files|Cache|JobAdministration|CSVImportExport|ApprovalWorkflows|CommerceCatalog|CustomerAccounts)PlanApplyVerifyEndToEnd$|^TestJavaMySQLObservabilityPlanApplyVerifyEndToEnd$' -count=1
      - name: Generate Python and test platform capabilities against MySQL
        env:
          SCAFFOLD_AGENT_RUN_PYTHON_BUILD: "1"
          TEST_DATABASE_URL: mysql+pymysql://root:mysql@127.0.0.1:3306/scaffold_agent_python?charset=utf8mb4
        run: go test ./internal/engine -run '^TestPythonMySQLTenant(Notifications|Files|Cache|JobAdministration|CSVImportExport|ApprovalWorkflows|CommerceCatalog)PlanApplyVerifyEndToEnd$|^TestPythonMySQLObservabilityPlanApplyVerifyEndToEnd$' -count=1
