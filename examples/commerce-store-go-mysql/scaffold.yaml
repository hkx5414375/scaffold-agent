api_version: scaffold-agent.io/v1alpha1
kind: Project
metadata:
  name: commerce-store-go-mysql
  display_name: Commerce Store MySQL
spec:
  stack:
    backend: go
    admin_ui: element-plus
    storefront: nuxt
  database:
    engine: mysql
  auth:
    modes: [session, token]
  capabilities:
    - name: organization-tenancy
      version: 0.3.0
    - name: commerce-catalog
      version: 0.1.0
    - name: customer-accounts
      version: 0.1.0
    - name: commerce-operations
      version: 0.1.0
  modules:
    - name: notes
      entities:
        - name: note
          fields:
            - name: title
              type: string
              required: true
      permissions:
        - code: notes:note:create
        - code: notes:note:read
        - code: notes:note:update
        - code: notes:note:delete
      acceptance:
        - Generic notes remain independent from commerce records.
