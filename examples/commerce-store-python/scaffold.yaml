api_version: scaffold-agent.io/v1alpha1
kind: Project
metadata:
  name: commerce-store-python
  display_name: Commerce Store Python
spec:
  stack:
    backend: python
    admin_ui: element-plus
    storefront: nuxt
  database:
    engine: postgresql
  auth:
    modes: [session, token]
  capabilities:
    - name: organization-tenancy
      version: 0.3.0
    - name: commerce-catalog
      version: 0.1.0
    - name: customer-accounts
      version: 0.1.0
    - name: commerce-operations
      version: 0.1.0
