api_version: scaffold-agent.io/v1alpha1
kind: Project
metadata:
  name: inventory-service-python-mysql
  display_name: Inventory Service MySQL
spec:
  stack:
    backend: python
    admin_ui: element-plus
    storefront: none
  database:
    engine: mysql
  auth:
    modes: [session, token]
  capabilities:
    - name: organization-tenancy
      version: 0.3.0
    - name: erp-inventory
      version: 0.1.0
