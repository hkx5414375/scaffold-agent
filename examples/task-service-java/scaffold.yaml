api_version: scaffold-agent.io/v1alpha1
kind: Project
metadata:
  name: task-service-java
  display_name: Java Task Service
spec:
  stack:
    backend: java
    admin_ui: element-plus
    storefront: none
  database:
    engine: postgresql
  auth:
    modes:
      - session
      - token
  capabilities:
    - name: organization-tenancy
      version: 0.2.0
  modules:
    - name: tasks
      entities:
        - name: task
          fields:
            - name: title
              type: string
              required: true
              unique: true
            - name: description
              type: text
            - name: done
              type: bool
              required: true
            - name: priority
              type: int64
              required: true
            - name: due_at
              type: datetime
      permissions:
        - code: tasks:task:create
        - code: tasks:task:read
        - code: tasks:task:update
        - code: tasks:task:delete
      acceptance:
        - Each CRUD operation requires its matching permission.
        - Stale update and delete versions return a conflict without changing data.
        - Every successful mutation is committed atomically with its audit event.
